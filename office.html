<style>
/* Layout: the pixel-art office fills the whole screen; the game menu, stats and a dialogue box float on top of it like a 16-bit game HUD. Single look. */
:root {
  color-scheme: dark;

html, body { height: 100%; }
body { background: var(--ink); color: var(--paper); font-family: var(--body); font-size: 16px; overflow: hidden; }
#office { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
.hud { position: relative; z-index: 1; box-sizing: border-box; height: 100%; padding-block: 16px; padding-inline: 16px; display: flex; flex-direction: column; gap: 12px; pointer-events: none; }
.hud > * { pointer-events: auto; }
.box { background: var(--hud); border: 3px solid var(--hud-edge); box-shadow: 0 0 0 3px var(--ink), 6px 6px 0 3px rgba(0, 0, 0, .45); }
.top { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 14px; }
.menu { width: 250px; max-width: 100%; box-sizing: border-box; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; }
.brand { font-family: var(--pixel); font-weight: 700; font-size: 26px; line-height: 1.1; color: var(--paper); text-decoration: none; padding: 2px 4px 6px; }
.brand em { font-style: normal; color: var(--gold); }
.items { display: flex; flex-direction: column; gap: 8px; }
.items button {
  display: flex; align-items: center; gap: 10px; width: 100%; min-height: 46px; padding: 8px 10px; text-align: left;
  font-family: var(--pixel); font-weight: 600; font-size: 19px; line-height: 1.2;
  color: var(--paper); background: #2a2650; border: 2px solid var(--ink); box-shadow: inset -2px -2px 0 #15122e, inset 2px 2px 0 #3d3870; cursor: pointer;
}
.items button::before { content: ""; flex: none; width: 8px; height: 8px; background: transparent; }
.items button:hover::before, .items button[aria-pressed="true"]::before { background: currentColor; clip-path: polygon(0 0, 100% 50%, 0 100%); }
.items button[aria-pressed="true"] { background: var(--gold); color: var(--gold-ink); box-shadow: inset -2px -2px 0 #c98a2a, inset 2px 2px 0 #ffe0a3; }
.items button:focus-visible, .brand:focus-visible, .out:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.out { font-family: var(--pixel); font-size: 16px; color: var(--mist); text-decoration: none; padding: 8px 4px 2px; }
.out:hover { color: var(--gold); }
.stats { display: flex; flex-wrap: wrap; gap: 10px 22px; padding: 12px 14px; align-items: center; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat span { font-family: var(--pixel); font-size: 13px; letter-spacing: .06em; color: var(--mist); text-transform: uppercase; }
.stat b { font-family: var(--body); font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat b.cash { color: var(--gold); }
.sample { font-family: var(--pixel); font-weight: 600; font-size: 13px; text-transform: uppercase; color: var(--gold-ink); background: var(--gold); padding: 6px 8px; }
.talk { margin-top: auto; align-self: center; width: min(100%, 720px); box-sizing: border-box; padding: 14px 16px; }
.talk b { display: block; font-family: var(--pixel); font-size: 18px; font-weight: 700; color: var(--gold); margin-bottom: 4px; }
#status { margin: 0; font-family: var(--body); font-size: 18px; line-height: 1.45; min-height: 2.9em; }
.hud.scene .top { visibility: hidden; }
.tbtn { display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px; }
.tbtn[hidden], .card[hidden] { display: none; }
.sbtn { min-height: 44px; padding: 8px 16px; font: 600 17px var(--pixel); color: var(--paper); background: #2a2650; border: 2px solid var(--ink); box-shadow: inset -2px -2px 0 #15122e, inset 2px 2px 0 #3d3870; cursor: pointer; }
.sbtn.go { background: var(--gold); color: var(--gold-ink); box-shadow: inset -2px -2px 0 #c98a2a, inset 2px 2px 0 #ffe0a3; }
.sbtn.big { font-size: 20px; padding: 12px 24px; }
.sbtn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.card { position: fixed; inset: 0; z-index: 10; background: #07060f; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 24px; text-align: center; }
.card p { margin: 0; max-width: 30ch; font-family: var(--body); font-weight: 600; font-size: clamp(20px, 3.4vw, 30px); line-height: 1.3; }
.card p.floor { font-family: var(--pixel); font-weight: 700; font-size: clamp(44px, 9vw, 88px); color: var(--gold); line-height: 1; }
@media (max-width: 767px) {
  .hud { padding-block: 10px; padding-inline: 10px; gap: 10px; }
  .menu { width: 100%; padding: 10px; }
  .items { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .items button { font-size: 16px; min-height: 44px; padding: 6px 8px; gap: 6px; }
  .stats { width: 100%; box-sizing: border-box; padding: 10px; gap: 10px 14px; }
}
</style>

    if (!reduce) { var sp = (t * 1.6) % 4; R(dx + 6.5 + Math.sin(t * 3) * .5, dt - 7.5 - sp, .6, 1, 'rgba(255,255,255,' + (.7 - sp * .17) + ')'); R(dx + 7.8 - Math.sin(t * 3) * .5, dt - 9 - sp, .6, 1, 'rgba(255,255,255,' + (.45 - sp * .11) + ')'); }
    box(dx + 11.5, dt - 1.5, 7, 1.5, '#fbf8ee'); R(dx + 12, dt - 2, 7, .5, '#e3dfd0'); R(dx + 12.5, dt - 1, 4, .3, '#9aa1b3');
    box(dx + 44, dt - 4, 3, 4, '#5a6b99'); R(dx + 44.5, dt - 6.5, .5, 2.5, '#d14a3c'); R(dx + 45.6, dt - 7, .5, 3, '#e8b84a'); R(dx + 46.4, dt - 6, .5, 2, '#fbf8ee');
    // desk lamp
    glow(dx + 54, dt - 6, 14, '255,224,150', .35); quad([dx + 50, dt - 11, dx + 58, dt - 11, dx + 64, dt, dx + 44, dt], 'rgba(255,230,160,.16)');
    box(dx + 55, dt - 1, 8, 1, '#2c2f3d'); g.strokeStyle = O; g.lineWidth = 2; g.beginPath(); g.moveTo((dx + 59) * 2, (dt - 1) * 2); g.lineTo((dx + 61) * 2, (dt - 10) * 2); g.lineTo((dx + 56) * 2, (dt - 14.5) * 2); g.stroke();
    quad([dx + 49, dt - 12, dx + 57, dt - 16.5, dx + 59, dt - 13, dx + 51, dt - 10], O); quad([dx + 49.8, dt - 12, dx + 56.7, dt - 15.8, dx + 58.2, dt - 13.2, dx + 51.2, dt - 10.7], '#338a64'); R(dx + 52, dt - 13.6, 3, .5, '#5cc095');

    if (L + 206 <= UW) {
      var hx = L + 191; shadow(hx + 6, fy + 12, 9, 1.8, .32);
      box(hx + 1, fy - 24, 10, 16, '#3c4158'); R(hx + 1.8, fy - 23.2, 8.4, 2, '#565d7c'); R(hx + 1, fy - 10, 10, 2, '#2c3045'); box(hx - .5, fy - 5.5, 13, 3.5, '#3c4158'); R(hx - .5, fy - 5.5, 13, 1, '#565d7c');
      R(hx + 5, fy - 8, 2, 2.5, O); R(hx + 5, fy - 2, 2, 9, O); R(hx + 5.5, fy - 2, .5, 9, '#565d7c'); R(hx - 1, fy + 7, 14, 1.5, O); [-1.5, 5, 11.5].forEach(function (o) { R(hx + o, fy + 8.5, 2.5, 2.5, O); R(hx + o + .5, fy + 9, 1, 1, '#565d7c'); });
    }

    var px = L + 98, bob = !reduce && Math.floor(t * 1.5) % 2 === 1, blink = !reduce && (t % 4) > 3.86;
    shadow(px + 8, fy + 11, 10, 2, .34);
    if (scene.on) {
      var tg = L + 72;
      if (!scene.arrived) { scene.nx = Math.min(tg, scene.nx + .55); if (scene.nx >= tg) { scene.arrived = true; scene.i = 0; showLine(); } } else scene.nx = tg;

    var vg = g.createRadialGradient(UW, UH * .9, UH * .7, UW, UH * .9, Math.max(UW, UH) * 1.5); vg.addColorStop(0, 'rgba(14,10,36,0)'); vg.addColorStop(1, 'rgba(14,10,36,.42)'); g.fillStyle = vg; g.fillRect(0, 0, UW * 2, UH * 2);

  function resize() {
    var W = window.innerWidth, H = window.innerHeight, wide = W >= 768;
    var f0 = Math.min(H / 300, (W - (wide ? 300 : 0)) / 424), f = Math.max(1, Math.floor(f0));
    if (Math.min(H / 280, (W - (wide ? 290 : 0)) / 380) >= f + 1) f += 1;

  var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(resize, 120); });
  resize(); if (!reduce) requestAnimationFrame(loop);

  var st = document.getElementById('status'), btns = document.querySelectorAll('.items button'), who = document.getElementById('who'), me = who.textContent;

    ['Nepo Baby', "Love the office. Two whole windows, and a front-row seat to the world's shittiest hot dog stand. Inspiring stuff."],

  function met() { try { return localStorage.getItem('cornerOfficeMetNepo') === '1'; } catch (e) { return false; } }
  function showLine() { var l = LINES[scene.i]; who.textContent = l[0]; st.textContent = l[1]; document.getElementById('sceneNext').focus({ preventScroll: true }); }
  function startScene() {
    scene.on = true; scene.arrived = false; scene.i = -1; scene.nx = -20;
    document.querySelector('.hud').classList.add('scene'); document.getElementById('sceneBtns').hidden = false;
    who.textContent = '...'; st.textContent = 'Someone walks into your office.';
    if (reduce) { scene.arrived = true; scene.i = 0; showLine(); draw(0); }
  }
  function endScene() { document.getElementById('floorCard').hidden = false; document.getElementById('floorGo').focus(); }
  document.getElementById('sceneNext').addEventListener('click', function () {
    if (!scene.arrived) { scene.arrived = true; scene.i = 0; showLine(); } else if (++scene.i >= LINES.length) endScene(); else showLine();
    if (reduce) draw(0);
  });
  document.getElementById('sceneSkip').addEventListener('click', endScene);
  document.getElementById('floorGo').addEventListener('click', function () { try { localStorage.setItem('cornerOfficeMetNepo', '1'); } catch (e) {} window.location.href = 'career.html'; });
  btns.forEach(function (b) {
    b.addEventListener('click', function () {
      btns.forEach(function (o) { o.setAttribute('aria-pressed', String(o === b)); });
      if (b.dataset.name === 'Career Mode') { if (met()) window.location.href = 'career.html'; else startScene(); return; }
      st.textContent = b.dataset.name + ' opens from here. That part of the game is not built yet.';
    });
  });
})();
