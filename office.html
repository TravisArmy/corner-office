<style>
/* Layout: the pixel-art office fills the whole screen; the game menu, stats and a dialogue box float on top of it like a 16-bit game HUD. Single look. */
:root {

}
html, body { height: 100%; }

#office { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
.hud { position: relative; z-index: 1; box-sizing: border-box; height: 100%; padding-block: 16px; padding-inline: 16px; display: flex; flex-direction: column; gap: 12px; pointer-events: none; }
.hud > * { pointer-events: auto; }
.box { background: var(--hud); border: 3px solid var(--hud-edge); box-shadow: 0 0 0 3px var(--ink), 6px 6px 0 3px rgba(0, 0, 0, .45); }
.top { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 14px; }
.menu { width: 250px; max-width: 100%; box-sizing: border-box; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; }
.brand { font-family: var(--pixel); font-weight: 700; font-size: 26px; line-height: 1.1; color: var(--paper); text-decoration: none; padding: 2px 4px 6px; }
.brand em { font-style: normal; color: var(--gold); }
.items { display: flex; flex-direction: column; gap: 8px; }
.items button {
  display: flex; align-items: center; gap: 10px; width: 100%; min-height: 46px; padding: 8px 10px; text-align: left;
  font-family: var(--pixel); font-weight: 600; font-size: 19px; line-height: 1.2;
  color: var(--paper); background: #2a2650; border: 2px solid var(--ink); box-shadow: inset -2px -2px 0 #15122e, inset 2px 2px 0 #3d3870; cursor: pointer;
}
.items button::before { content: ""; flex: none; width: 8px; height: 8px; background: transparent; }
.items button:hover::before, .items button[aria-pressed="true"]::before { background: currentColor; clip-path: polygon(0 0, 100% 50%, 0 100%); }
.items button[aria-pressed="true"] { background: var(--gold); color: var(--gold-ink); box-shadow: inset -2px -2px 0 #c98a2a, inset 2px 2px 0 #ffe0a3; }
.items button:focus-visible, .brand:focus-visible, .out:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.out { font-family: var(--pixel); font-size: 16px; color: var(--mist); text-decoration: none; padding: 8px 4px 2px; }
.out:hover { color: var(--gold); }
.stats { display: flex; flex-wrap: wrap; gap: 10px 22px; padding: 12px 14px; align-items: center; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat span { font-family: var(--pixel); font-size: 13px; letter-spacing: .06em; color: var(--mist); text-transform: uppercase; }
.stat b { font-family: var(--pixel); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat b.cash { color: var(--gold); }
.sample { font-family: var(--pixel); font-weight: 600; font-size: 13px; text-transform: uppercase; color: var(--gold-ink); background: var(--gold); padding: 6px 8px; }
.talk { margin-top: auto; align-self: center; width: min(100%, 720px); box-sizing: border-box; padding: 14px 16px; }
.talk b { display: block; font-family: var(--pixel); font-size: 18px; font-weight: 700; color: var(--gold); margin-bottom: 4px; }
#status { margin: 0; font-family: var(--pixel); font-size: 19px; line-height: 1.4; min-height: 2.8em; }
@media (max-width: 767px) {
  .hud { padding-block: 10px; padding-inline: 10px; gap: 10px; }
  .menu { width: 100%; padding: 10px; }
  .items { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .items button { font-size: 16px; min-height: 44px; padding: 6px 8px; gap: 6px; }
  .stats { width: 100%; box-sizing: border-box; padding: 10px; gap: 10px 14px; }
}
</style>
