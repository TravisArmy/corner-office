<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Public+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a full-screen living skyline; signage-style entry bars anchored lower left, like wayfinding at a transit hall. Night is the default scene, day is a switch. */
:root {
  color-scheme: dark;
  --ground: #0a0d26;
  --scrim: 10, 13, 38;
  --scrim-a: .8; --scrim-b: .38; --scrim-c: .5;

  --sodium-deep: #f09a2e;
  --hi: #ffbe5c;

  --body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
:root.day {
  color-scheme: light;
  --ground: #bfe0f7;
  --scrim: 14, 22, 52;
  --scrim-a: .62; --scrim-b: .22; --scrim-c: 0;
  --hi: #ffd27a;
  --paper: #ffffff;
  --mist: #e3ecfb;
  --glass: rgba(14, 22, 52, 0.58);
  --line: rgba(255, 255, 255, 0.42);
  --halo: rgba(10, 18, 48, 0.6);
}
html, body { height: 100%; }
body {
  background: var(--ground);
  color: var(--paper);
  font-family: var(--body);
  font-size: 16px;
  overflow-x: hidden;
}
#city { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.scrim {
  position: fixed; inset: 0; pointer-events: none;
  background:
    linear-gradient(90deg, rgba(var(--scrim),var(--scrim-a)) 0%, rgba(var(--scrim),var(--scrim-b)) 45%, rgba(var(--scrim),0) 70%),
    linear-gradient(0deg, rgba(var(--scrim),var(--scrim-c)) 0%, rgba(var(--scrim),0) 40%);
}
main {
  position: relative;
  min-height: 100%;
  box-sizing: border-box;
  padding-block: clamp(24px, 6vh, 64px);
  padding-inline: clamp(16px, 6vw, 88px);
  display: flex; flex-direction: column; justify-content: flex-end;
  gap: clamp(20px, 4vh, 36px);
}
:root.day .scrim {
  background: linear-gradient(0deg, rgba(var(--scrim),.42) 0%, rgba(var(--scrim),.16) 45%, rgba(var(--scrim),0) 80%);

#mode {
  position: fixed; z-index: 2;
  top: calc(env(safe-area-inset-top, 0px) + 16px); right: 16px;
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--paper); background: var(--glass);
  border: 1px solid var(--line); border-radius: 3px; cursor: pointer;

#mode:focus-visible { outline: 3px solid var(--paper); outline-offset: 3px; }
#mode .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--sodium); box-shadow: 0 0 10px var(--sodium); }
.readout {
  font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--mist);
  display: flex; flex-wrap: wrap; gap: 6px 20px;
  font-variant-numeric: tabular-nums;
}
.readout b { color: var(--hi); font-weight: 500; }
h1 {
  font-family: var(--display); font-weight: 800;
  font-size: clamp(52px, 11vw, 136px);
  line-height: .88; letter-spacing: -.01em; text-transform: uppercase;
  margin: 0; max-width: 9ch; text-wrap: balance;
  text-shadow: 0 2px 30px var(--halo);

.lede { margin: 0; max-width: 44ch; line-height: 1.55; color: var(--paper); opacity: .9; }

.field input:focus-visible { outline: 3px solid var(--hi); outline-offset: 1px; }

.hint { font-size: 13px; line-height: 1.45; color: var(--mist); }
.err { font-size: 13px; line-height: 1.45; color: #ffb3b3; font-weight: 600; }

.pw input { flex: 1; min-width: 0; }

.pw button:hover { border-color: var(--hi); }
.pw button:focus-visible { outline: 3px solid var(--paper); outline-offset: 2px; }
button.bar { width: 100%; font-family: var(--display); font-size: clamp(20px, 5.5vw, 26px); }
.alt { margin: 0; font-size: 15px; color: var(--paper); }
.alt a { color: var(--hi); font-weight: 600; }
#status { color: var(--paper); }
@media (max-width: 700px) { .scrim { background: rgba(var(--scrim), .72); } }
:root.day .scrim { background: rgba(var(--scrim), .2); }
.signup h1 { font-size: clamp(44px, 7vw, 76px); }
@media (max-width: 700px) { :root.day .scrim { background: rgba(var(--scrim), .66); } }
.forgot { align-self: flex-start; font-size: 14px; color: var(--hi); font-weight: 600; }
.forgot:focus-visible { outline: 3px solid var(--paper); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { .bar, .bar .arrow { transition: none; } }

<canvas id="city" aria-hidden="true"></canvas>
<div class="scrim"></div>
<button id="mode" type="button"><span class="dot" aria-hidden="true"></span><span id="mode-label">Switch to day</span></button>

<main class="signup">
  <a class="back" href="index.html">&larr; Corner Office</a>
  <div class="readout">
    <span>Local time <b id="clock">--:--</b></span>
    <span>Front doors <b>open</b></span>
    <span>Doorman <b>on duty</b></span>
  </div>
  <h1>Investor <em>Login</em></h1>
  <p class="lede">Welcome back. The doors are open and your desk is waiting.</p>
  <form class="form" id="login-form" novalidate>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" aria-describedby="email-err">
      <span class="err" id="email-err" hidden></span>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <div class="pw">
        <input id="password" name="password" type="password" autocomplete="current-password" aria-describedby="pw-err">
        <button type="button" id="pw-toggle" aria-pressed="false" aria-controls="password">Show</button>
      </div>
      <span class="err" id="pw-err" hidden></span>
    </div>
    <a class="forgot" id="forgot" href="#forgot">Forgot your password?</a>
    <button class="bar create" type="submit">Log in <span class="arrow" aria-hidden="true">&rarr;</span></button>
    <p id="status" role="status" aria-live="polite"></p>
  </form>
  <p class="alt">New here? <a href="signup.html">Create Investor</a></p>
</main>

<script>
(function () {
  var f = document.getElementById('login-form'), st = document.getElementById('status');
  var em = document.getElementById('email'), pw = document.getElementById('password'), tg = document.getElementById('pw-toggle');
  tg.addEventListener('click', function () {
    var show = pw.type === 'password'; pw.type = show ? 'text' : 'password';
    tg.textContent = show ? 'Hide' : 'Show'; tg.setAttribute('aria-pressed', String(show));
  });
  function mark(input, errId, msg) {
    var e = document.getElementById(errId);
    input.setAttribute('aria-invalid', msg ? 'true' : 'false');
    e.textContent = msg || ''; e.hidden = !msg; return !msg;
  }
  document.getElementById('forgot').addEventListener('click', function (ev) {
    ev.preventDefault(); st.textContent = 'Design preview: password reset is not connected yet.';
  });
  f.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var a = mark(em, 'email-err', /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em.value.trim()) ? '' : 'Enter the email you signed up with.');
    var b = mark(pw, 'pw-err', pw.value.length ? '' : 'Enter your password.');
    if (!a) em.focus(); else if (!b) pw.focus();
    if (a && b) { window.cornerLogin(em.value.trim(), pw.value, st); return; }
    st.textContent = '';
  });
})();
</script>
<script>
window.cornerLogin = function (email, pw, st) {
  if (!window.Cloud || !Cloud.ready) { window.location.href = 'office.html'; return; }
  st.textContent = 'Checking your details...';
  Cloud.signIn(email, pw).then(function (r) {
    if (r.error) st.textContent = r.error; else window.location.href = r.hasCharacter ? 'office.html' : 'character.html';
  });
};
document.getElementById('forgot').addEventListener('click', function () {
  if (!window.Cloud || !Cloud.ready) return;
  var em = document.getElementById('email').value.trim(), st = document.getElementById('status');
  if (!em) { setTimeout(function () { st.textContent = 'Type your email in the box above, then click this link again.'; }, 0); return; }
  Cloud.reset(em).then(function (r) { st.textContent = r.error || 'If that email has an account, a reset link is on its way.'; });
});
</script>
