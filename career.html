/* Layout: one desktop computer fills the window. Inside its screen: weights tree on the left, live risk metrics on the right; after confirming, a performance report. Calm dark screen, built for long sessions. Single look. */
:root {
  color-scheme: dark;
  --room: #1b1836;
  --bezel: #d9cfb4; --bezel-hi: #f1e9d2; --bezel-lo: #a99d80; --bezel-ink: #3a3326;
  --scr: #121a1c; --scr2: #19252a; --field: #0d1416; --line: #2c3d43;
  --ink: #e8f0ec; --dim: #9db2aa;
  --amber: #f2c078; --head: #f2c078; --bar: #6aa3ee; --pos: #74d6a0; --neg: #f2a092;

  --term: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --pixel: "Pixelify Sans", "Trebuchet MS", Verdana, sans-serif;
}
.monitor.light { --scr: #eeebe2; --scr2: #fbfaf6; --field: #ffffff; --line: #d3cec0; --ink: #1c2321; --dim: #58645f; --head: #8a5510; --bar: #2f6fd0; --pos: #15734a; --neg: #b53a2b; --you: #b06f12; --idx: #2f6fd0; }
html, body { min-height: 100%; }
body { background: var(--room); color: var(--ink); font-family: var(--term); font-size: 15px; line-height: 1.5; }
.monitor { box-sizing: border-box; min-height: 100vh; display: flex; flex-direction: column; padding-block: 14px 0; padding-inline: clamp(16px, 2.6vw, 34px); background: linear-gradient(#e3dac0, var(--bezel) 12%, var(--bezel) 88%, #c9be9f); border: 3px solid var(--bezel-ink); border-radius: 18px; box-shadow: inset 4px 4px 0 var(--bezel-hi), inset -4px -4px 0 var(--bezel-lo); }
.plate { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 16px; padding: 0 8px 10px; font-family: var(--pixel); font-weight: 700; font-size: 13px; letter-spacing: .1em; color: var(--bezel-ink); }
.led { display: inline-block; width: 9px; height: 9px; margin-right: 8px; border-radius: 50%; background: #3fae6f; border: 2px solid var(--bezel-ink); }
.crt { position: relative; flex: 1; display: flex; flex-direction: column; color: var(--ink); background: var(--scr); border: 12px solid #2b271f; border-radius: 26px; overflow: hidden; box-shadow: 0 0 0 3px var(--bezel-lo), 0 0 0 6px var(--bezel-hi), inset 0 0 0 2px #0a0907; }
.chin { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 24px; padding: 14px 8px 16px; font-family: var(--pixel); font-weight: 700; font-size: 12px; letter-spacing: .1em; color: var(--bezel-ink); }
.vents { width: 120px; height: 20px; background: repeating-linear-gradient(90deg, var(--bezel-ink) 0 3px, transparent 3px 9px); opacity: .55; }
.badge { padding: 4px 10px; border: 2px solid var(--bezel-ink); border-radius: 3px; background: var(--bezel-hi); }
.badge b { margin-left: 6px; padding: 0 5px; background: var(--bezel-ink); color: var(--bezel-hi); }
.drive { position: relative; flex: 0 1 260px; height: 28px; background: #2b271f; border-radius: 4px; box-shadow: inset 0 2px 0 #0a0907, 0 1px 0 var(--bezel-hi); }
.drive .slot { position: absolute; left: 14px; right: 54px; top: 12px; height: 4px; background: #0a0907; }
.drive .eject { position: absolute; right: 26px; top: 8px; width: 18px; height: 12px; background: var(--bezel-lo); border-radius: 2px; }
.drive .dled { position: absolute; right: 10px; top: 11px; width: 6px; height: 6px; background: #e0a63a; }
.knobs { display: flex; align-items: center; gap: 12px; }
.knobs i { width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #6a6252, #2b271f 70%); border: 2px solid var(--bezel-ink); position: relative; }
.knobs i::after { content: ""; position: absolute; left: 9px; top: 2px; width: 2px; height: 7px; background: var(--bezel-hi); }
.pw { display: inline-flex; align-items: center; }
.bar { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 20px; padding: 10px 20px; background: var(--field); border-bottom: 1px solid var(--line); color: var(--pos); font-family: var(--mono); font-size: 13px; letter-spacing: .06em; align-items: center; }
.barR { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; }
.modebtn { font: 600 12px var(--term); letter-spacing: .08em; min-height: 32px; padding: 4px 12px; color: var(--ink); background: var(--scr2); border: 1px solid var(--line); border-radius: 16px; cursor: pointer; }
.modebtn:hover { border-color: var(--pos); }
.modebtn:focus-visible, .info:focus-visible, .sg:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
#screen { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.keys { display: flex; flex-wrap: wrap; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--line); background: var(--field); }
h1, h2 { margin: 0; font-family: var(--term); }
h1 { font-size: 24px; font-weight: 600; color: var(--ink); text-wrap: balance; }
h2 { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--head); }
p { margin: 0; max-width: 78ch; }
.dim { color: var(--dim); }
.pos { color: var(--pos); } .neg { color: var(--neg); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 8px 16px; font: 600 13px var(--term); letter-spacing: .06em; color: var(--ink); background: var(--scr2); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; text-decoration: none; }
.btn:hover:not(:disabled) { border-color: var(--pos); color: var(--pos); }
.btn.go { background: var(--amber); border-color: var(--amber); color: #1f1708; }
.btn.go:hover:not(:disabled) { background: #f7d39e; border-color: #f7d39e; color: #1f1708; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:focus-visible, input:focus-visible, select:focus-visible, .tw:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
input, select { font: 14px var(--term); color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 5px; padding: 6px 10px; min-height: 40px; box-sizing: border-box; }
input[type="number"] { font-family: var(--mono); }
input:focus, select:focus { border-color: var(--pos); }
.cols { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start; }
.left { flex: 7 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 18px; }
.right { flex: 3 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 18px; }
.pane { border: 1px solid var(--line); border-radius: 8px; background: var(--scr2); padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tools input { flex: 1 1 200px; min-width: 0; }
.tree { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) 70px 96px 76px; gap: 10px; align-items: center; padding: 4px 6px; border-bottom: 1px solid var(--line); font-size: 14px; }
.row.head { color: var(--dim); font-size: 11px; font-weight: 600; letter-spacing: .1em; padding-block: 8px; }
.row.head .num { font-family: var(--term); }
.row.sec { font-weight: 600; }
.row.ind .nm { padding-left: 22px; } .row.stk .nm { padding-left: 46px; }
.row.stk { color: var(--dim); } .row.stk .num:last-child, .row.stk input { color: var(--ink); }
.row.flat .nm { padding-left: 4px; }
.row.flash { background: rgba(242, 192, 120, .16); outline: 1px solid var(--amber); }
.nm { min-width: 0; overflow-wrap: anywhere; }
.tw { font: inherit; color: var(--ink); background: none; border: 0; padding: 6px 2px; text-align: left; cursor: pointer; min-height: 36px; }
.tw:hover { color: var(--head); }
.tw .cv { display: inline-block; width: 18px; color: var(--dim); }
.tk { font-family: var(--mono); font-size: 13px; color: var(--head); margin-right: 4px; }
.row input { width: 100%; text-align: right; min-height: 34px; padding: 2px 8px; font-size: 14px; }
.addbox { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; align-items: end; }
.addbox label { display: flex; flex-direction: column; gap: 4px; color: var(--dim); font-size: 12px; }
.addbox input, .addbox select { width: 100%; }
.addform { display: flex; flex-direction: column; gap: 10px; }
.sug { display: flex; flex-direction: column; gap: 4px; }
.sg { font: 14px var(--term); text-align: left; color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 5px; padding: 8px 10px; min-height: 40px; cursor: pointer; }
.sg:hover { border-color: var(--pos); }
.match { padding: 8px 10px; border: 1px solid var(--pos); border-radius: 5px; background: var(--field); font-size: 14px; }
.ph { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.info { flex: none; width: 26px; height: 26px; border-radius: 50%; font: italic 600 14px Georgia, serif; color: var(--ink); background: var(--field); border: 1px solid var(--dim); cursor: pointer; position: relative; }
.info::after { content: ""; position: absolute; inset: -9px; }
.info:hover, .info[aria-expanded="true"] { border-color: var(--head); color: var(--head); }
.note { font-size: 13px; padding: 10px 12px; border-left: 3px solid var(--head); background: var(--field); border-radius: 0 5px 5px 0; }
.gl { stroke: var(--line); stroke-width: 1; } .zl { stroke: var(--dim); stroke-width: 1; } .ax { fill: var(--dim); } .lb { fill: var(--ink); } .xl { stroke: var(--ink); stroke-width: 1; }
.li, .ly { fill: none; stroke-width: 2; stroke-linejoin: round; } .li { stroke: var(--idx); } .ly { stroke: var(--you); }
.di, .dy { stroke: var(--scr2); stroke-width: 2; } .di { fill: var(--idx); } .dy { fill: var(--you); }
.hero { display: flex; flex-direction: column; gap: 10px; padding-block: 8px 4px; }
.hero h1 { font-size: clamp(28px, 4.2vw, 46px); line-height: 1.08; font-weight: 600; max-width: 20ch; }
.hero p { font-size: 16px; color: var(--dim); max-width: 62ch; }
.mk { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
.card { gap: 14px; }
.card.off { opacity: .72; }
.mname { font-size: 20px; font-weight: 600; }
.tag { font-size: 11px; font-weight: 600; letter-spacing: .1em; padding: 3px 9px; border: 1px solid var(--line); border-radius: 12px; color: var(--dim); white-space: nowrap; }
.tag.on { color: var(--pos); border-color: var(--pos); }
.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 14px; font-size: 14px; align-items: baseline; flex: 1; align-content: start; }
.tourbox { position: fixed; z-index: 5; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); width: min(calc(100% - 32px), 620px); box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; padding: 16px 18px; color: var(--ink); background: var(--field); border: 2px solid var(--amber); border-radius: 10px; box-shadow: 0 12px 40px rgba(0, 0, 0, .45); }
.tourbox b { font-size: 18px; }
.tourbox p { font-size: 15px; }
.tbtn { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.tourhl { outline: 3px solid var(--amber); outline-offset: 4px; border-radius: 8px; }
.tabs { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
.tab { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 8px 16px; font: 600 13px var(--term); letter-spacing: .08em; color: var(--dim); background: transparent; border: 1px solid var(--line); border-radius: 22px; cursor: pointer; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); background: var(--scr2); border-color: var(--head); }
.tab:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.chip { font-size: 11px; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--line); color: var(--dim); }
.chip.won { color: var(--pos); border-color: var(--pos); }
.challenge { border-color: var(--head); }
.challenge.won { border-color: var(--pos); }
.goal { font-size: 18px; font-weight: 600; }
.pips { display: inline-flex; gap: 6px; }
.pips i { width: 22px; height: 8px; border-radius: 4px; background: var(--field); border: 1px solid var(--line); }
.pips i.on { background: var(--head); border-color: var(--head); }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; font-size: 14px; }
.big { font-family: var(--mono); font-size: 28px; font-weight: 500; line-height: 1.15; color: var(--ink); }
.big.pos { color: var(--pos); } .big.neg { color: var(--neg); } .big.warn { color: var(--head); }
.lab { font-size: 11px; font-weight: 600; letter-spacing: .1em; color: var(--dim); }
.meter { display: flex; flex-wrap: wrap; gap: 14px 28px; }
.meter > div { display: flex; flex-direction: column; gap: 2px; }
.bars { display: grid; grid-template-columns: minmax(0, 1fr) minmax(60px, 34%) 58px; gap: 6px 10px; align-items: center; font-size: 13px; }
.track { position: relative; height: 8px; background: var(--field); border-radius: 4px; }
.track i { position: absolute; top: 0; bottom: 0; border-radius: 4px; } .track u { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--dim); }
.warn { color: var(--head); }
.small { font-size: 13px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 18px; }
.tile { border: 1px solid var(--line); border-radius: 8px; background: var(--scr2); padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.chartwrap { position: relative; }
.chartwrap svg { display: block; width: 100%; height: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 13px; }
.legend i { display: inline-block; width: 16px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 8px; }
.tip { position: absolute; top: 6px; pointer-events: none; background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; font: 12px/1.6 var(--mono); white-space: nowrap; z-index: 2; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left; }
th { color: var(--dim); font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
td.num, th.num { text-align: right; }
th.num { font-family: var(--term); }
tbody tr:last-child td { border-bottom: 0; }
.demo { border: 1px dashed var(--line); border-radius: 8px; padding: 14px 18px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.demo p { flex: 1 1 260px; min-width: 0; font-size: 13px; }
@media (max-width: 640px) {
  .monitor { padding-block: 8px 0; border-radius: 10px; }
  .crt { border-width: 6px; border-radius: 14px; }
  .vents, .drive { display: none; }
  #screen { padding: 12px; gap: 14px; }
  .pane { padding: 12px; }
  .row { grid-template-columns: minmax(0, 1fr) 54px 76px 60px; gap: 6px; font-size: 13px; }
  .row.ind .nm { padding-left: 10px; } .row.stk .nm { padding-left: 22px; }
  .bars { grid-template-columns: minmax(0, 1fr) 64px 60px; }
}
</style>

  function render(focusId) {

    if (!S.market) { ui.screen = 'career'; renderCareer(); } else if (ui.screen === 'perf' && S.W) renderPerf(); else { ui.screen = 'weights'; renderWeights(); }
    showTour();
    if (focusId && $(focusId)) { $(focusId).focus(); if ($(focusId).select && (focusId === 'q' || focusId === 'a_t')) { var v = $(focusId).value; $(focusId).setSelectionRange(v.length, v.length); } }
  }

  /* ---------- events ---------- */
  var scr = $('screen');
  scr.addEventListener('click', function (ev) {
    var b = ev.target.closest('button'); if (!b) return;
    if (b.dataset.market) { S.market = b.dataset.market; S.start = iso(new Date()); ui.screen = 'weights'; ui.tour = 0; save(); window.scrollTo(0, 0); render(); return; }
    if (b.dataset.ptab) { ui.ptab = b.dataset.ptab; render(); var tb = scr.querySelector('[data-ptab="' + ui.ptab + '"]'); if (tb) tb.focus(); return; }
    if (b.dataset.pick) { keepAdd(); ui.add.t = b.dataset.pick; ui.addMsg = ''; render('a_w'); return; }
    if (b.dataset.info) { ui.info[b.dataset.info] = !ui.info[b.dataset.info]; render(); var ib = scr.querySelector('[data-info="' + b.dataset.info + '"]'); if (ib) ib.focus(); return; }
    if (b.dataset.open) { ui.open[b.dataset.open] = !ui.open[b.dataset.open]; render(); var nb = scr.querySelector('[data-open="' + b.dataset.open + '"]'); if (nb) nb.focus(); return; }
    if (b.id === 'rebal') { ui.msg = rebalance(); save(); render('rebal'); }
    else if (b.id === 'reset') { S.draft = benchW(); S.touched = []; S.custom = []; ui.addMsg = ''; ui.msg = 'Weights reset to match the S&P 500.'; save(); render('reset'); }
    else if (b.id === 'confirm') { ui.tour = -1; S.W = JSON.parse(JSON.stringify(S.draft)); ui.msg = ''; ui.screen = 'perf'; save(); render(); window.scrollTo(0, 0); }
    else if (b.id === 'sim1') { recordClose(); save(); render('sim1'); }
    else if (b.id === 'sim20') { var dd = new Date(), back = 0; while (dd.getDay() === 0 || dd.getDay() === 6) dd.setDate(dd.getDate() - 1); while (back < 19) { dd.setDate(dd.getDate() - 1); if (dd.getDay() !== 0 && dd.getDay() !== 6) back++; } S.start = iso(dd); S.days = []; S.cum = {}; S.sec = SECT.map(function () { return [0, 0]; }); for (var i = 0; i < 20; i++) recordClose(); save(); render('sim20'); }
    else if (b.id === 'wipe') { S = { v: 1, start: iso(new Date()), W: null, draft: benchW(), touched: [], custom: [], days: [], sec: SECT.map(function () { return [0, 0]; }), cum: {}, market: null }; ui.screen = 'career'; ui.tour = -1; ui.msg = ''; save(); render(); window.scrollTo(0, 0); }
  });
  scr.addEventListener('change', function (ev) {
    var el = ev.target;
    if (el.dataset && el.dataset.k) {
      var v = Math.max(0, Math.min(100, parseFloat(el.value) || 0)) / 100, all = names(), id = el.dataset.id;
      if (el.dataset.k === 'N') { S.draft[id] = v; touch(id); }
      else if (el.dataset.k === 'S') setGroup(all.filter(function (x) { return x.s === +id; }), v);
      else setGroup(all.filter(function (x) { return x.i === +id; }), v);
      ui.msg = ''; save(); render(el.id);
    } else if (el.id === 'a_s') { keepAdd(); ui.add.s = +el.value; ui.add.i = -1; render('a_s'); }
    else if (el.id && el.id.indexOf('a_') === 0) keepAdd();
  });
  function keepAdd() { ['t', 'n', 'w'].forEach(function (k) { if ($('a_' + k)) ui.add[k] = $('a_' + k).value; }); if ($('a_i') && $('a_i').value !== '') ui.add.i = +$('a_i').value; }
  scr.addEventListener('input', function (ev) { if (ev.target.id === 'q') { ui.q = ev.target.value; render('q'); } else if (ev.target.id === 'a_t') { keepAdd(); ui.addMsg = ''; render('a_t'); } });
  scr.addEventListener('submit', function (ev) {
    if (ev.target.id !== 'addForm') return; ev.preventDefault(); keepAdd();
    var t = ui.add.t.trim().toUpperCase(), n = ui.add.n.trim(), wv = Math.max(0, Math.min(100, parseFloat(ui.add.w) || 0)) / 100, hit = DIR_BY[t], ii = hit ? hit[2] : ($('a_i') && $('a_i').value !== '' ? +$('a_i').value : -1);
    if (hit) n = hit[1];
    ui.addOk = false; ui.msg = '';
    if (!t) ui.addMsg = 'Type a ticker or company name, for example ASML.';
    else if (names().some(function (x) { return x.t === t; })) ui.addMsg = t + ' is already on your list. Use the search box at the top to find it.';
    else if (!hit && !$('a_i')) ui.addMsg = 'Pick one of the matching companies shown under the box.';
    else if (!/^[A-Z0-9.]{1,8}$/.test(t)) ui.addMsg = 'Enter a ticker of 1 to 8 letters or numbers.';
    else if (!(wv > 0)) ui.addMsg = 'Enter a weight above 0 for ' + t + ', for example 2.';
    else if (ii < 0) ui.addMsg = 'Choose an industry for ' + t + '.';
    else {
      S.custom.push({ t: t, n: n || t, i: ii }); S.draft[t] = wv; touch(t); rebalance();
      ui.q = ''; ui.open['S' + IND[ii].s] = true; ui.open['I' + ii] = true; ui.flash = t;
      ui.addOk = true; ui.addMsg = t + ' added at ' + pct(wv) + ' under ' + SECT[IND[ii].s] + ' > ' + IND[ii].name + '. Your other holdings were scaled down to make room.';
      ui.add = { t: '', n: '', s: IND[ii].s, i: -1, w: '' };
    }
    save(); render();
    var fl = ui.flash && $('w_N_' + ui.flash); ui.flash = '';
    if (fl) { fl.closest('.row').classList.add('flash'); fl.closest('.row').scrollIntoView({ block: 'center' }); fl.focus(); } else if ($('addMsg')) $('addMsg').scrollIntoView({ block: 'nearest' });
  });
  $('keys').addEventListener('click', function (ev) {
    var b = ev.target.closest('button'); if (!b) return;
    if (b.id === 'toWeights') { S.draft = JSON.parse(JSON.stringify(S.W)); ui.screen = 'weights'; ui.msg = ''; render(); window.scrollTo(0, 0); }
    else if (b.id === 'toPerf') { ui.tour = -1; ui.screen = 'perf'; render(); window.scrollTo(0, 0); }
    else if (b.id === 'howto') { ui.tour = 0; showTour(); }
  });
  var light = false; try { light = localStorage.getItem('cornerOfficeScreen') === 'light'; } catch (e) {}
  function applyMode() { $('monitor').classList.toggle('light', light); $('mode').textContent = light ? 'DARK MODE' : 'LIGHT MODE'; }
  $('mode').addEventListener('click', function () { light = !light; applyMode(); try { localStorage.setItem('cornerOfficeScreen', light ? 'light' : 'dark'); } catch (e) {} });
  applyMode();
  render();
})();
</script>
</body></html>
